services:
  - type: web
    name: clima-zap-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: clima-zap-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE_NAME
        sync: false
      - key: FORECAST_GROUP_JID
        sync: false

databases:
  - name: clima-zap-db
    databaseName: clima_zap
    user: clima_zap
    plan: free