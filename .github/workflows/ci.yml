name: Clima-Zap CI Pipeline

on:
  push:
    branches: [ "main", "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar suíte de testes com Pytest
      run: |
        cd backend
        PYTHONPATH=. python -m pytest

    - name: Validar qualidade do código
      run: python -m pylint backend

    - name: Validar migrations
      env:
        DATABASE_URL: sqlite+aiosqlite:///./ci.db
      run: |
        cd backend
        python -m alembic upgrade head
        python -m alembic check

    - name: Validar configuração do Compose
      run: |
        cp .env.example .env
        docker compose config --quiet

    - name: Construir imagens Docker
      run: docker compose build backend frontend