name: Clima-Zap CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy para Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_SERVICE_URL: ${{ secrets.WORKERS_SERVICE_URL }}
    steps:
      - name: Verificar configuração do deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID não configurado."
            echo "Cadastre esses segredos no environment production para ativar o CD."
            exit 1
          fi

      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sincronizar dependências Pyodide (pywrangler sync)
        working-directory: backend
        run: uvx --from workers-py pywrangler sync

      - name: Aplicar migrations do D1
        working-directory: backend
        run: npx --yes wrangler d1 migrations apply clima-zap --remote

      - name: Deploy do Worker (pywrangler)
        working-directory: backend
        run: uvx --from workers-py pywrangler deploy

      - name: Aguardar serviço saudável
        if: ${{ env.WORKERS_SERVICE_URL != '' }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "${WORKERS_SERVICE_URL}/health" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Serviço não ficou saudável dentro do prazo."
          exit 1
