[project]
name = "clima-zap-api"
version = "1.0.0"
description = "API de monitoramento e alertas climáticos do Cariri (Cloudflare Workers)"
readme = "../README.md"
requires-python = ">=3.12"
# Dependências do bundle do Worker (Python Workers/Pyodide). Só entra aqui o que
# o caminho Pyodide importa: nada de SQLAlchemy/APScheduler (que arrasta
# apscheduler+tzdata+tzlocal) — eles vivem exclusivamente no caminho Docker
# (requirements.txt da raiz) e são importados tarde via `app.db.orm`. O teste
# `tests/test_worker_bundle.py` falha se algum voltar ao grafo do Worker.
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "evolution-whatsapp",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
